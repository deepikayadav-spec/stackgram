<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stackgram</title>
<meta name="description" content="A student content feed for DSA, Full Stack, Aptitude, Maths, English, GenAI and Misc - upload clips or notes of any length, collect likes and followers.">
<meta name="theme-color" content="#0E6E58">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css?v=c71c09ff">
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <div class="brand"><i></i>Stackgram</div>
  </div>
</div>

<div class="scroller" id="scroller">
  <div class="wrap">
  <div class="searchbar" id="searchbar" hidden>
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input id="q" type="search" placeholder="Search posts, creators, tags…" autocomplete="off">
  </div>

  <div id="banner"></div>
  <div class="stats" id="board" hidden></div>
  <div class="tracks" id="tracks"></div>

  <div class="toolrow">
    <select id="f-dur" aria-label="Length">
      <option value="all">Any length</option>
      <option value="s">Under 1 min</option>
      <option value="m">1–5 min</option>
      <option value="l">5–20 min</option>
      <option value="x">20 min+</option>
    </select>
    <select id="f-sort" aria-label="Sort">
      <option value="new">Newest</option>
      <option value="top">Most liked</option>
    </select>
    <div class="count" id="count"></div>
  </div>

  <div id="main-out"></div>
  </div>
</div>

<nav class="tabbar" aria-label="Sections">
  <button id="t-feed" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="9" rx="2"></rect><rect x="14" y="3" width="7" height="5" rx="2"></rect><rect x="3" y="16" width="7" height="5" rx="2"></rect><rect x="14" y="12" width="7" height="9" rx="2"></rect></svg>
    Home
  </button>
  <button id="t-shorts" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="4"></rect><path d="m11 9 4 3-4 3z" fill="currentColor" stroke="none"></path></svg>
    Shorts
  </button>
  <button id="t-search" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    Search
  </button>
  <button class="fab" id="t-upload" aria-label="Upload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
  <button id="t-following" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.4"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M18 8.5v5M20.5 11h-5"></path></svg>
    Subs
  </button>
  <button id="t-you" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.6"></circle><path d="M5 20c0-3.5 3.1-5.6 7-5.6s7 2.1 7 5.6"></path></svg>
    You
  </button>
</nav>

<div id="layer"></div>

<script src="store-local.js?v=c0de04ce"></script>
<script src="app.js?v=7582ed20"></script>
</body>
</html>
